<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="../css/menu.css" rel="stylesheet">
    <link href="../css/reproductor.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
    


    <header class="header-ada p-3">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                <a href="menu.html" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none me-lg-4">
                    <img src="../image/logochico.png" alt="ADA MUSIC" height="40">
                </a>
                <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                    <li><a href="menu.html" class="nav-link px-2">Menú Principal</a></li>
                    <li><a href="catalogo.html" class="nav-link px-2">Catálogo</a></li>
                    <li><a href="reproductor.html" class="nav-link px-2 text-white fw-bold">Reproductor</a></li>
                    <li><a href="playlist.html" class="nav-link px-2">Playlists</a></li>
                    <li><a href="historial.html" class="nav-link px-2">Historial</a></li>
                </ul>
                
                <div class="dropdown text-end">
                <button class="btn btn-secondary dropdown-toggle fw-bold" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false" style="background-color: #8c428f; border: none;">
                <span id="nombre-usuario-nav"></span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="userDropdown">
                <li><h6 class="dropdown-header">Opciones</h6></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" onclick="localStorage.removeItem('usuarioLogueado'); window.location.href='index.html?vista=login'; return false;">Cerrar sesión</a></li>
                </ul>
                </div>
            </div>
        </div>
    </header>
    

    <main class="container py-5 d-flex justify-content-center">
        <div class="reproductor-card p-4 rounded-3">

            <!-- Portada y datos de la canción actual -->
            <img id="portada" class="portada mb-3" src="" alt="Portada de la canción">
            <h2 id="nombreCancion" class="h4 mb-1">Nombre de la canción</h2>
            <p id="nombreArtista" class="text-secondary mb-4">Artista</p>

            <!-- El audio real. El src se cambia desde JS al cargar cada canción -->
            <audio id="audio"></audio>

            <!-- Barra de progreso -->
            <div class="d-flex align-items-center gap-2 mb-3">
                <span id="tiempoActual" class="tiempo">0:00</span>
                <input type="range" id="barraProgreso" class="form-range flex-grow-1" value="0" min="0" max="100">
                <span id="tiempoTotal" class="tiempo">0:00</span>
            </div>

            <!-- Controles -->
            <div class="d-flex justify-content-center align-items-center gap-4">
                <button id="btnAnterior" class="btn-control" type="button" aria-label="Canción anterior">
                    <i class="fa fa-step-backward" aria-hidden="true"></i>
                </button>
                <button id="btnPlayPause" class="btn-control btn-control-grande" type="button" aria-label="Reproducir">
                    <i id="iconoPlayPause" class="fa fa-play" aria-hidden="true"></i>
                </button>
                <button id="btnSiguiente" class="btn-control" type="button" aria-label="Canción siguiente">
                    <i class="fa fa-step-forward" aria-hidden="true"></i>
                </button>
            </div>

            <!-- Botón de favorito -->
            <button id="btnFavorito" class="btn-favorito mt-3" type="button" aria-label="Agregar a favoritos">
                <i id="iconoFavorito" class="fa-regular fa-heart" aria-hidden="true"></i>
            </button>

        </div>
    </main>

    <script src="../js/catalogo.js"></script>
<script src="../js/reproductor.js"></script>

<script>
function buscarCancion(event) {
    event.preventDefault();

    let texto = document.getElementById("busqueda").value.toLowerCase();

    for (let i = 0; i < catalogo.length; i++) {

        if (catalogo[i].nombre.toLowerCase().includes(texto) ||
            catalogo[i].artista.toLowerCase().includes(texto)) {

            localStorage.setItem("cancionBuscada", i);
            window.location.href = "reproductor.html";
            return;
        }
    }

    
}
</script>

        </a>

            <li class="nav-item"><a href="tel:+56962448657" class="nav-link px-2 text-body-secondary">+56 9 6244 8657</a></li> 
            <li class="nav-item"><a href="mailto:soporte@ada.music.com" class="nav-link px-2 text-body-secondary">soporte@ada.music.com</a></li> 
        </ul> 
        
    </footer> 

    <script src="../js/navbar.js"></script>
</body>
</html>
