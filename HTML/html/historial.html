    <link href="../css/menu.css" rel="stylesheet">

        footer .text-body-secondary {

        /* Tarjetas del historial  */
        #historial p {
            background-color: #3d2673;
            border: 1px solid #5a3c9e;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>


<body>

    <!-- HEADER ADA MUSIC -->
    <header class="header-ada p-3">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">

                <!-- logo -->
                <a href="menu.html" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none me-lg-4">
                    <img src="../image/logochico.png" alt="ADA MUSIC" height="40">
                </a>

                <!-- enlaces -->
                <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                    <li><a href="menu.html" class="nav-link px-2">Menú Principal</a></li>
                    <li><a href="catalogo.html" class="nav-link px-2">Catálogo</a></li>
                    <li><a href="playlist.html" class="nav-link px-2">Playlists</a></li>
                    <li><a href="historial.html" class="nav-link px-2 text-white fw-bold">Historial</a></li>
                </ul>

                <!-- cerrar sesión -->
                <div class="dropdown text-end">
                <button class="btn btn-secondary dropdown-toggle fw-bold" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false" style="background-color: #8c428f; border: none;">
                <span id="nombre-usuario-nav"></span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="userDropdown">
                <li><a class="dropdown-item text-danger" href="#" onclick="localStorage.removeItem('usuarioLogueado'); window.location.href='index.html?vista=login'; return false;">Cerrar sesión</a></li>
                </ul>
                </div>

            </div>
        </div>
    </header>


    <!-- HISTORIAL -->
    <div class="container px-4 py-5">

        <h2 class="pb-2 border-bottom">Historial</h2>

        <div id="historial"></div>

    </div>


    <script>

        let historial = localStorage.getItem("historial");

        if (historial == null || historial == "") {

            document.getElementById("historial").innerHTML =
            "<p>No has escuchado canciones todavía.</p>";

        } else {

            let canciones = historial.split(",");

            for (let i = 0; i < canciones.length; i++) {

                if (canciones[i] != "") {

                    document.getElementById("historial").innerHTML +=
                    "<p> " + canciones[i] + "</p>";

                }

            }

        }

    </script>
