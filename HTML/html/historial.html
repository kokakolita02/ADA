    <style>
        #historial p {
            background-color: white;
            padding: 15px;

            border-radius: 10px;
            color: #350aa3;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body class="bg-body-tertiary">

    <!-- HEADER ADA MUSIC -->
    <header class="header-ada p-3">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">

                <!-- logo -->
                <a href="menu.html" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none me-lg-4">
                    <img src="../image/logochico.png" alt="ADA MUSIC" height="40">
                </a>

                <!-- enlaces -->
                <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                    <li><a href="menu.html" class="nav-link px-2">Menú Principal</a></li>
                    <li><a href="reproductor.html" class="nav-link px-2">Reproductor</a></li>
                    <li><a href="playlist.html" class="nav-link px-2">Playlists</a></li>
                    <li><a href="historial.html" class="nav-link px-2 text-white fw-bold">Historial</a></li>

                <div class="text-end">
                    <a href="login.html" class="btn btn-primary">Cerrar sesión</a>
                </div>

            </div>
        </div>
    </header>


    <!-- HISTORIAL -->
    <div class="container px-4 py-5">

        <h2 class="pb-2 border-bottom">Historial</h2>

        <div id="historial"></div>

    </div>


    <script>

        let historial = localStorage.getItem("historial");

        if (historial == null || historial == "") {

            document.getElementById("historial").innerHTML =
            "<p>No has escuchado canciones todavía.</p>";

        } else {

            let canciones = historial.split(",");

            for (let i = 0; i < canciones.length; i++) {

                if (canciones[i] != "") {

                    document.getElementById("historial").innerHTML +=
                    "<p> " + canciones[i] + "</p>";

                }

            }

        }

    </script>
