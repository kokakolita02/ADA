<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrador - ADA MUSIC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="../css/login.css" rel="stylesheet">
</head>

<body class="text-center d-flex flex-column min-vh-100 bg-body-tertiary">

    <main class="form-signin w-100 m-auto" style="max-width: 330px; padding: 15px;">
        <form action="menu.html">

            <h1 class="h3 mb-3 fw-normal text-light">
                <img src="../image/logochico.png" alt="ADA MUSIC" width="100">
            </h1>
            <h3 class="mb-4 text-secondary">Administrador</h3>

            <div class="form-floating mb-3">
                <input type="user" class="form-control" id="floatingInput" placeholder="Usuario" required>
                <label for="floatingInput">ID de Administrador</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Contraseña" required>
                <label for="floatingPassword">PIN</label>
            </div>

            <div class="form-check text-start my-3">
                <input class="form-check-input" type="checkbox" value="remember-me" id="checkDefault">
                <label class="form-check-label" for="checkDefault"> Recordarme </label>
            </div>

            <button class="btn btn-primary w-100 py-2" type="submit">Entrar</button>

        </form>
    </main>

    <footer class="mt-auto py-3 border-top">
        <div class="container d-flex flex-wrap justify-content-between align-items-center">
            <div class="col-md-4 d-flex align-items-center">
                <span class="mb-3 mb-md-0 text-body-secondary">© 2026 ADA MUSIC</span>
            </div>

            <div class="col-md-4 d-flex align-items-center justify-content-center">
                <a href="login.html" class="btn btn-outline-primary">Login User</a>
            </div>

            <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
                <li class="ms-3"><a class="text-body-secondary text-decoration-none" href="#">Reportar Problemas</a></li>
            </ul>
        </div>
    </footer>

</body>
</html>
