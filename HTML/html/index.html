<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ADA MUSIC</title>

    <!-- Enlace Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Estilos personalizados -->
    <link href="../css/menu.css" rel="stylesheet">
    
    <link href="../css/index.css" rel="stylesheet">

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="bg-body-tertiary" x-data="appAdaMusic()">

  
    <template x-if="vistaActual === 'inicio'">
        <main>
            <div class="container py-4">
                <header class="d-flex justify-content-center pb-3 mb-4 border-bottom">
                    <a href="#" @click.prevent="vistaActual = 'inicio'" class="text-decoration-none">
                        <img src="../image/logochico2.png" alt="ADA MUSIC" height="40">
                    </a>
                </header>

                <div class="container my-5">
                    <div class="text-center py-4 px-3 rounded-4 shadow-sm card-presentacion">
                        <h4 class="fw-bold mb-3 text-ada-dark">Desarrollo y despliegue de un sitio web estático en AWS</h4>
                        <p class="fs-5 mb-2 text-ada-purple">Nicolás Inostroza, Daniel Ramos y Jeremias Salcedo</p>
                        <span class="badge rounded-pill mt-2 bg-ada-badge badge-seccion">Sección 1</span>
                    </div>
                </div>

                <div class="p-5 mb-4 text-white rounded-3 text-center hero-section">
                    <div class="container-fluid py-5">
                        <h1 class="display-5 fw-bold">Bienvenidos a ADA MUSIC</h1>
                        <p class="col-md-8 mx-auto fs-4">ADA MUSIC es una plataforma web donde podrás escuchar y organizar tu música de una forma sencilla.</p>
                        
                        <button @click="vistaActual = 'login'" class="btn btn-ada-primary btn-lg mt-3">
                            Iniciar sesión
                        </button>
                    </div>
                </div>

                <footer class="pt-3 mt-4 text-body-secondary border-top container">
                    © 2026 ADA MUSIC
                </footer>
            </div>
        </main>
    </template>

   
    <template x-if="vistaActual === 'login'">
        <div class="text-center d-flex flex-column min-vh-100">
            <main class="form-signin w-100 m-auto mt-5 login-container">
                <form @submit.prevent="validarLogin">
                    <h1 class="h3 mb-3 fw-normal text-light">
                        <a href="#" @click.prevent="vistaActual = 'inicio'">
                            <img src="../image/logo2.png" alt="ADA MUSIC" width="250">
                        </a>
                    </h1>
                    <h3 class="mb-4 text-secondary">Inicio de sesión</h3>

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingInput" placeholder="Usuario" x-model="usuario" required>
                        <label for="floatingInput">Usuario</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="floatingPassword" placeholder="Contraseña" x-model="password" required>
                        <label for="floatingPassword">Contraseña</label>
                    </div>

                    <button class="btn btn-primary w-100 py-2 mb-2" type="submit">Entrar</button>
                    <button type="button" @click="vistaActual = 'inicio'" class="btn btn-outline-secondary w-100 py-2">Volver al inicio</button>

                    <div x-show="errorLogin" class="alert alert-danger mt-3" role="alert" x-transition>
                        Credenciales incorrectas
                    </div>
                </form>
            </main>

            <footer class="mt-auto py-3 border-top bg-light">
                <div class="container d-flex flex-wrap justify-content-between align-items-center">
                    <div class="col-md-4 d-flex align-items-center">
                        <span class="mb-3 mb-md-0 text-body-secondary">© 2026 ADA MUSIC</span>
                    </div>
                </div>
            </footer>
        </div>
    </template>

    <!-- Lógica de la aplicación -->
    <script src="../js/app.js"></script>
    <!-- Script Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
