<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - ADA MUSIC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="../css/login.css" rel="stylesheet">
</head>

<body class="text-center d-flex flex-column min-vh-100 bg-body-tertiary">

    <main class="form-signin w-100 m-auto" style="max-width: 330px; padding: 15px;">
        <!-- Se quitó action="menu.html" y se agregó id="loginForm" -->
        <form id="loginForm">

            <h1 class="h3 mb-3 fw-normal text-light">
                <img src="../image/logo2.png" alt="ADA MUSIC" width="250">
            </h1>
            <h3 class="mb-4 text-secondary">Inicio de sesión</h3>

            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="floatingInput" placeholder="Usuario" required>
                <label for="floatingInput">Usuario</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Contraseña" required>
                <label for="floatingPassword">Contraseña</label>
            </div>

            <div class="form-check text-start my-3">
                <input class="form-check-input" type="checkbox" value="remember-me" id="checkDefault">
                <label class="form-check-label" for="checkDefault"> Recordarme </label>
            </div>

            <button class="btn btn-primary w-100 py-2" type="submit">Entrar</button>

            <!-- Mensaje de error oculto por defecto, con estilos de Bootstrap -->
            <div id="mensaje-error" class="alert alert-danger mt-3" style="display: none;" role="alert">
                Credenciales incorrectas
            </div>

        </form>
    </main>

    <footer class="mt-auto py-3 border-top">
        <div class="container d-flex flex-wrap justify-content-between align-items-center">
            <div class="col-md-4 d-flex align-items-center">
                <span class="mb-3 mb-md-0 text-body-secondary">© 2026 ADA MUSIC</span>
            </div>

            <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
                <li class="ms-3"><a class="text-body-secondary text-decoration-none" href="mailto:soporte@ada.music.com">soporte@ada.music.com</a></li>
            </ul>
        </div>
    </footer>

    <!-- Conexión al archivo JavaScript -->
    <script src="../js/login.js"></script>
</body>
</html>
